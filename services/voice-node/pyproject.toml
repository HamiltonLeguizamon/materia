[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "materia-voice-node"
version = "0.1.0"
description = "Portable private-network voice gateway for Materia"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
materia-voice-node = "voice_node.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_node*"]
