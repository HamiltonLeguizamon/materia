services:
  materia:
    build:
      context: .
    environment:
      MATERIA_PROVIDER: ${MATERIA_PROVIDER:-demo}
      MATERIA_DATA_DIR: /app/.data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5.6-luna}
      OPENAI_SPEECH_MODEL: ${OPENAI_SPEECH_MODEL:-gpt-4o-mini-tts-2025-12-15}
      OPENAI_SPEECH_VOICE: ${OPENAI_SPEECH_VOICE:-coral}
      OPENAI_SPEECH_SPEED: ${OPENAI_SPEECH_SPEED:-1}
      OPENAI_SPEECH_INSTRUCTIONS: ${OPENAI_SPEECH_INSTRUCTIONS:-}
      KOKORO_BASE_URL: ${KOKORO_BASE_URL:-}
      KOKORO_SPEECH_MODEL: ${KOKORO_SPEECH_MODEL:-mlx-community/Kokoro-82M-bf16}
      KOKORO_SPEECH_VOICE: ${KOKORO_SPEECH_VOICE:-ef_dora}
      KOKORO_LANGUAGE: ${KOKORO_LANGUAGE:-e}
      KOKORO_SPEECH_SPEED: ${KOKORO_SPEECH_SPEED:-1}
      KOKORO_TIMEOUT_MS: ${KOKORO_TIMEOUT_MS:-120000}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_SPEECH_MODEL: ${QWEN_SPEECH_MODEL:-mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-6bit}
      QWEN_TIMEOUT_MS: ${QWEN_TIMEOUT_MS:-180000}
      MATERIA_VOICE_NODES: ${MATERIA_VOICE_NODES:-[]}
      VOICE_NODE_TIMEOUT_MS: ${VOICE_NODE_TIMEOUT_MS:-900000}
      VOICE_NODE_REQUEST_TIMEOUT_MS: ${VOICE_NODE_REQUEST_TIMEOUT_MS:-30000}
      VOICE_NODE_POLL_INTERVAL_MS: ${VOICE_NODE_POLL_INTERVAL_MS:-1000}
      MATERIA_VOICE_NODE_TOKEN: ${MATERIA_VOICE_NODE_TOKEN:-}
    ports:
      - "${MATERIA_BIND_ADDRESS:-127.0.0.1}:3210:3210"
    volumes:
      - materia-data:/app/.data
    restart: unless-stopped

volumes:
  materia-data:
    name: ${MATERIA_DATA_VOLUME:-materia-data}
