[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp?maxTokenBudget=3000"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.aws_knowledge]
url = "https://knowledge-mcp.global.api.aws"
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.google_developer_knowledge]
command = "node"
args = ["scripts/google-developer-knowledge-mcp.mjs"]
required = false
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.materia]
command = "pnpm"
args = ["run", "mcp"]
required = true
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

[mcp_servers.materia.tools.materia_generate_audio]
approval_mode = "prompt"

[mcp_servers.materia.tools.materia_publish_course]
approval_mode = "prompt"
